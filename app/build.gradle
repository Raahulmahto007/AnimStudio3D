plugins { id 'com.android.application' }

android {
    namespace 'com.animstudio3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.animstudio3d'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    dependencies {\n        implementation 'androidx.webkit:webkit:1.12.1'\n    }\n\n    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
