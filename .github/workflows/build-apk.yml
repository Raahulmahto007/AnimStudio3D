name: Build Anim Studio 3D APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js for asset validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor Three.js for offline runtime
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/three.module.js https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js
          curl --fail --location --retry 3 --output app/src/main/assets/THREE-LICENSE.txt https://raw.githubusercontent.com/mrdoob/three.js/r170/LICENSE
      - name: Validate animation editor assets
        run: python3 scripts/validate_web_assets.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and bundled offline assets
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/three.module.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/THREE-LICENSE.txt'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimStudio3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
